services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 5

  backend:
    build: ./server
    develop:
      watch:
        - action: sync+restart
          path: ./server/app
          target: /app/app
        - action: sync+restart
          path: ./server/migrations
          target: /app/migrations
        - action: rebuild
          path: ./server/requirements.txt
        - action: rebuild
          path: ./server/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the root .env file}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000
    develop:
      watch:
        - action: rebuild
          path: ./client
          ignore:
            - node_modules/
            - dist/
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: